name: Public build contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unsigned-evaluation:
    name: ${{ matrix.os }} public build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Use pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      - name: Verify bundled npm
        shell: bash
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(node scripts/run-npm.mjs --version)" = "10.9.8"

      - name: Credential-free bootstrap
        shell: bash
        run: ./scripts/bootstrap

      - name: Full check
        shell: bash
        run: ./scripts/check

      - name: Build local unsigned evaluation artifacts
        shell: bash
        run: ./scripts/build-release

      - name: Save online release identity
        shell: bash
        run: node scripts/create-release-replay-identity.mjs release-artifacts .cache/test-results/online-release-identity.json

      - name: Cache-enforced replay with fail-fast proxy sentinels
        shell: bash
        env:
          npm_config_offline: 'true'
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          # npm is cache-only and proxy-aware tools fail fast. Tools can ignore
          # proxy variables, so this is not an OS network-isolation proof.
          # build-release performs its own frozen bootstrap and full check.
          ./scripts/build-release --offline

      - name: Compare online and cache-replay identities
        shell: bash
        run: |
          node scripts/create-release-replay-identity.mjs release-artifacts .cache/test-results/replay-release-identity.json
          node scripts/compare-release-replay.mjs .cache/test-results/online-release-identity.json .cache/test-results/replay-release-identity.json

      - name: Upload ineligible evaluation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dicekeys-${{ runner.os }}-${{ runner.arch }}-evidence-ineligible
          if-no-files-found: error
          # The repository/scanner licensing gate forbids redistributing the
          # generated web ZIP or desktop TAR. Upload evidence only.
          path: |
            release-artifacts/*.json
            release-artifacts/sbom/*.json
            release-artifacts/SHA256SUMS
